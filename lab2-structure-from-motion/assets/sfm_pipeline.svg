<svg width="820" height="200" viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="200" fill="#ffffff"/>

  <!-- Node 1: Feature matching -->
  <rect x="20" y="70" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="105" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Feature matching</text>
  <text x="105" y="112" text-anchor="middle" font-size="11" fill="#185FA5">SIFT / SuperGlue</text>

  <line x1="190" y1="100" x2="222" y2="100" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 2: RANSAC pose estimation -->
  <rect x="225" y="70" width="180" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
  <text x="315" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Pose estimation</text>
  <text x="315" y="112" text-anchor="middle" font-size="11" fill="#993C1D">Essential matrix, RANSAC</text>

  <line x1="405" y1="100" x2="437" y2="100" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 3: Triangulation -->
  <rect x="440" y="70" width="160" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="520" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Triangulation</text>
  <text x="520" y="112" text-anchor="middle" font-size="11" fill="#0F6E56">Sparse 3D points</text>

  <line x1="600" y1="100" x2="632" y2="100" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 4: Bundle adjustment -->
  <rect x="635" y="70" width="165" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="717" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Bundle adjustment</text>
  <text x="717" y="112" text-anchor="middle" font-size="11" fill="#0F6E56">Ceres non-linear refinement</text>

  <!-- Legend -->
  <rect x="20" y="165" width="14" height="14" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="40" y="176" font-size="11" fill="#333333">Correspondence</text>
  <rect x="170" y="165" width="14" height="14" fill="#FAECE7" stroke="#993C1D"/>
  <text x="190" y="176" font-size="11" fill="#333333">Estimation / RANSAC</text>
  <rect x="360" y="165" width="14" height="14" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="380" y="176" font-size="11" fill="#333333">Refinement / verification</text>
</svg>
